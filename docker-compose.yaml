services:
  uitjobs-be:
    image: sugm4d1c/uitjobs-be:v1
    container_name: uitjobs-be
    restart: always
    env_file:
      - ./BE/.env
    environment:
      - NODE_ENV=production

  uitjobs-fe:
    image: sugm4d1c/uitjobs-fe:v1
    container_name: uitjobs-fe
    restart: always
    env_file:
      - ./FE/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - uitjobs-be

  nginx-proxy:
    image: sugm4d1c/nginx-proxy:v1
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - uitjobs-fe
      - uitjobs-be

networks:
  default:
    name: uitjobs
